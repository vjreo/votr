# Render Blueprint - VOTR Backend
# Deploy: https://dashboard.render.com → New → Blueprint → Connect repo
# Set OPEN_STATES_API_KEY in Dashboard after first deploy (for NC legislators)

services:
  - type: web
    name: votr-api
    runtime: node
    region: oregon
    rootDir: backend

    buildCommand: npm install
    startCommand: npm run db:migrate && npm start

    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: OPEN_STATES_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: votr-db
          property: connectionString

    healthCheckPath: /health

databases:
  - name: votr-db
    databaseName: votr
    plan: free
