name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: votr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/votr_test
      NODE_ENV: test
      PORT: "3000"

    steps:
      - uses: actions/checkout@v4

      - name: Generate test JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Database migrate
        run: npm run db:migrate

      - name: Seed database
        run: npm run db:seed

      - name: Start API and smoke tests
        run: |
          npm start &
          echo $! > /tmp/votr-api.pid
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:3000/health" > /dev/null; then break; fi
            sleep 1
          done
          npm run test:api
        env:
          API_BASE_URL: http://localhost:3000/api

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/votr-api.pid ]; then kill $(cat /tmp/votr-api.pid) 2>/dev/null || true; fi

  mobile-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install mobile dependencies
        run: npm install

      # App-source JSX errors remain with React 19 typings until RN/@types align; skipLibCheck helps deps only.
      - name: TypeScript
        run: npm run typecheck
        continue-on-error: true

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Build
        run: npm run build
