name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

# Security: Least-privilege permissions (only what's needed for Pages deploy)
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      # Security: All actions pinned to specific versions
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.1.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high || true

      - name: Build
        run: npm run build

      - name: Scan build for secrets
        run: |
          echo "Scanning build output for sensitive patterns..."
          if grep -riE "(api[_-]?key|secret|password|database.?url|supabase|firebase)" dist/ 2>/dev/null | grep -v "type=.password"; then
            echo "WARNING: Potential secrets found in build output"
            exit 1
          fi
          echo "No secrets found in build output"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
